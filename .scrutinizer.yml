# language: php

coding_style:
    php:
        indentation:
            general:
                use_tabs: true
                size: 3
            switch:
                indent_case: true
        spaces:
            general:
                linefeed_character: newline
            before_parentheses:
                function_declaration: false
                closure_definition: false
                function_call: false
                if: true
                for: true
                while: true
                switch: true
                catch: true
                array_initializer: false
            around_operators:
                assignment: true
                logical: true
                equality: true
                relational: true
                bitwise: true
                additive: true
                multiplicative: true
                shift: true
                unary_additive: false
                concatenation: true
                negation: true
            before_left_brace:
                class: true
                function: true
                if: true
                else: true
                for: true
                while: true
                do: true
                switch: true
                try: true
                catch: true
                finally: true
            before_keywords:
                else: true
                while: true
                catch: true
                finally: true
            within:
                brackets: true
                array_initializer: true
                grouping: true
                function_call: true
                function_declaration: true
                if: true
                for: true
                while: true
                switch: true
                catch: true
                type_cast: false
            ternary_operator:
                before_condition: true
                after_condition: true
                before_alternative: true
                after_alternative: true
                in_short_version: false
            other:
                before_comma: false
                after_comma: true
                before_semicolon: false
                after_semicolon: true
                after_type_cast: true
        braces:
            classes_functions:
                class: end-of-line
                function: end-of-line
                closure: end-of-line
            if:
                opening: end-of-line
                always: true
                else_on_new_line: false
            for:
                opening: end-of-line
                always: true
            while:
                opening: end-of-line
                always: true
            do_while:
                opening: end-of-line
                always: true
                while_on_new_line: false
            switch:
                opening: end-of-line
            try:
                opening: end-of-line
                catch_on_new_line: false
                finally_on_new_line: false
        upper_lower_casing:
            keywords:
                general: lower
            constants:
                true_false_null: lower

tools:
    php_sim: true
    php_pdepend: true
    php_analyzer: true
    # No external_code_coverage: nothing in this repo pushes coverage to
    # Scrutinizer (the phpunit CI uploads clover to Codecov, not via ocular),
    # so configuring it only made every inspection idle until the timeout
    # waiting for data that never arrives.

filter:
    excluded_paths:
        - 'tests/'
        - 'includes/shim/'
        - 'example-functions.php'

checks:
    php:
        unreachable_code: true
        simplify_boolean_return: true
        return_in_constructor: true
        code_rating: true
        duplication: true

build:
    nodes:
        analysis:
            # Scrutinizer auto-infers `npm rebuild`/`npm install` for this node
            # just because a package.json exists, but the node only runs
            # php-scrutinizer-run and needs no JS deps. On Scrutinizer's old
            # toolchain (Node 10 + pre-C++20 g++) that inferred npm install dies
            # compiling the native `fs-ext-extra-prebuilt` addon (pulled in by
            # @wordpress/env 11 -> @wp-playground/cli), failing the whole build.
            # Override the inferred dependency commands with a no-op so npm
            # never runs. The override MUST live inside the node (top-level
            # build.dependencies is ignored for auto-setup nodes), and must be a
            # real command -- an empty list does not disable inference. See
            # https://github.com/scrutinizer-ci/scrutinizer/issues/339
            dependencies:
                override:
                    - 'true'
            tests:
                override:
                    - php-scrutinizer-run
