# Composer is deliberately omitted: CMB2 ships no Composer runtime deps, there is
# no committed composer.lock, and phpunit is held at ^9.6 for the PHP 7.4 floor.
version: 2
updates:
  # npm is dev tooling only (wp-env, Playwright, build CLIs). Grouped into one
  # monthly PR so updates don't pile up unmerged and re-pause Dependabot.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      npm-dev-tooling:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
